name: josh_security

description: "MVP Global Centinela - Aplicación de Seguridad Avanzada"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Archivos
  file_picker: ^8.1.2

  # Configuración
  flutter_dotenv: ^5.2.1

  # Red
  http: ^1.2.0

  # Criptografía
  crypto: ^3.0.7

  # Persistencia
  shared_preferences: ^2.5.5
  sqflite: ^2.4.0
  path: ^1.9.0

  # Permisos
  permission_handler: ^12.0.3

  # Background
  flutter_background_service: ^5.1.0

  # Notificaciones
  flutter_local_notifications: ^22.0.1

  # Estado
  provider: ^6.1.5+1

  # Telefonía
  phone_state: ^3.0.1

  # Overlay
  flutter_overlay_window: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - .env
